spring:
  application:
    name: "loans"

  datasource:
    url: jdbc:mysql://localhost:3307/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"

  profiles:
    active:
      - "prod"
server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"